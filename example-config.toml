# Copy and adjust this file, then pass it to `autodev start --config`.
[ollama]
model = "qwen3.6:35b-coding"
base_url = "http://127.0.0.1:11434"
timeout = 600

[runner]
max_attempts = 3
provider_max_wait_seconds = 600

# Optional role profiles run sequentially and fall back to [models].default.
[models]
default = "qwen3.6:35b-coding"

[agents.coder]
temperature = 0.05
timeout = 600
retries = 2
context_budget = 12000
context_limit = 16384
keep_alive = "10m"
