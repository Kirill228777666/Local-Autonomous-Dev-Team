[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-autonomous-dev-team"
version = "0.1.0"
description = "Local, persistent autonomous software-development orchestration"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autodev = "autodev.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.setuptools.packages.find]
where = ["src"]
